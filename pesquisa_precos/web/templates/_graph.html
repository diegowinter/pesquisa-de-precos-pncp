{# Fragmento do grafo — recarregado via HTMX a cada 3s (docs/06_API_E_WEB.md §4.1). #}
<div id="grafo" class="grafo" hx-get="/runs/{{ run.id }}/graph" hx-trigger="every 3s" hx-swap="outerHTML">
  {% for e in run.steps %}
  <a class="no-etapa {{ classe_step[e.status] }}" href="/runs/{{ run.id }}/steps/{{ e.step }}">
    <span class="icone">{{ icone(icone_step[e.status]) }}</span>
    <span class="titulo">{{ e.step }}<br>{{ e.titulo }}</span>
  </a>
  {% if not loop.last %}<span class="traco" aria-hidden="true"></span>{% endif %}
  {% endfor %}
</div>
