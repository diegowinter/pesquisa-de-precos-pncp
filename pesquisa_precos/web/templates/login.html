{% extends "base.html" %}
{% block titulo %}Entrar — Pesquisa de Preços PLASEG{% endblock %}
{% block conteudo %}
<div class="painel" style="max-width:360px;margin:3rem auto;">
  <h2>Entrar</h2>
  <form method="post" action="/login">
    <label for="usuario">Seu nome (fica em criado_por/aprovado_por)</label>
    <input id="usuario" name="usuario" required>
    {% if senha_exigida %}
    <label for="senha">Senha</label>
    <input id="senha" name="senha" type="password">
    {% endif %}
    <p style="margin-top:1rem;"><button class="principal" type="submit">Entrar</button></p>
  </form>
</div>
{% endblock %}
