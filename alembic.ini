; Alembic — migrations do PostgreSQL (Fase 2).
;
; A URL de conexão NÃO fica aqui: `alembic/env.py` a pega de `db.sessao.url_banco()`, que lê
; `DATABASE_URL` do `.env`. Duplicar a URL neste arquivo criaria a chance de migrar um banco
; e rodar a aplicação contra outro — falha silenciosa, do tipo que só aparece como "cadê meus
; dados" horas depois.

[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os
; Migration nova nasce como `0002_<slug>.py`: prefixo numérico ordenável a olho, porque a
; ordem de aplicação é a informação que mais se procura ao abrir a pasta.
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
