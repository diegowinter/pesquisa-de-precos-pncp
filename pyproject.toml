[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pesquisa-precos"
version = "0.1.0"
description = "Pesquisa de preços PLASEG via PNCP — pipeline de coleta, classificação, pareamento e export"
requires-python = ">=3.12"
dependencies = [
    "pandas",
    "pyarrow",
    "requests",
    "python-dotenv",
    "rich",
    "openpyxl",
    "pydantic>=2",          # Params de cada etapa; o mesmo schema gera o formulário da web
    "langchain-openai",
    "langchain-core",
    # `psycopg` 3, não 2, porque a migração depende de `cursor.copy()`; o extra [binary]
    # evita exigir libpq instalada no Windows.
    "sqlalchemy>=2",
    "alembic>=1.19.1",
    "psycopg[binary]>=3",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "jinja2>=3.1",          # web: Jinja2 + HTMX + Alpine.js, sem bundler (ADR-003)
    "python-multipart>=0.0.9",
    "itsdangerous>=2.2",    # cookie de sessão
    "cryptography>=43",     # cifra a chave de API de cada provedor (AES-GCM, db/secret.py)
]

[project.optional-dependencies]
dev = ["ruff", "pytest"]

[tool.setuptools.packages.find]
# Só o pacote da aplicação. `tools/` e `migracao/` são scripts avulsos, rodados de
# dentro do repositório — não fazem parte do pacote instalável.
include = ["pesquisa_precos*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = [
    # As etapas fazem `sys.stdout.reconfigure(encoding="utf-8")` ANTES de importar rich e
    # pandas — é o que evita acento corrompido no console do Windows. Isso obriga import
    # depois de código, e o autofix do isort moveria os imports para cima do reconfigure,
    # trazendo o bug de volta. Nesses módulos a ordem de import é manual.
    "E402",
    "I001",

    # Dívida da pipeline em scripts, herdada. Reativar por módulo quando houver motivo.
    "E501",   # linhas de 100-115 colunas
    # E741 fica ligado: `l` virou `linha` em todo o repositório.
    "E702",   # duas instruções na mesma linha, em blocos que montam tabela do rich
    "B905",   # zip() sem strict=
]

[tool.ruff.lint.isort]
known-first-party = ["pesquisa_precos"]

[tool.pytest.ini_options]
testpaths = ["tests"]
